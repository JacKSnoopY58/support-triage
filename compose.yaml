name: support-triage

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://triage:triage@db:5432/triage?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FAQ_DELAY_MS: ${FAQ_DELAY_MS:-0}
      FAQ_FAIL: ${FAQ_FAIL:-0}
      INCIDENT_DELAY_MS: ${INCIDENT_DELAY_MS:-0}
      INCIDENT_FAIL_MODE: ${INCIDENT_FAIL_MODE:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 20

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"

volumes:
  pgdata:
    name: support-triage-service-git_pgdata
